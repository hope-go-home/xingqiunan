name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend-tests:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt pytest

      - name: 运行测试（无需数据库/密钥的纯逻辑测试）
        run: python -m pytest tests -q
        env:
          DASHSCOPE_API_KEY: ""
          BOCHA_API_KEY: ""
          AMAP_API_KEY: ""
          DATABASE_URL: "postgresql+asyncpg://user:pass@localhost:5432/test"

      - name: 语法检查
        run: |
          python -m py_compile app/main.py app/api/chat.py app/agents/*.py

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build